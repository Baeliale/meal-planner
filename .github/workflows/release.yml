name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Extract changelog for version
        id: changelog
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          echo "NOTES<<EOF" >> $GITHUB_OUTPUT
          awk "/## \[${VERSION#v}\]/{flag=1; next} /## \[/{flag=0} flag" CHANGELOG.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ steps.get_version.outputs.VERSION }}
          body: |
            ${{ steps.changelog.outputs.NOTES }}
            
            ---
            
            ⏳ APK is being built and will be attached shortly...
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-attach-apk:
    name: Build and Attach APK
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build Android APK
        id: build
        run: |
          BUILD_OUTPUT=$(npx eas-cli build --platform android --profile preview --non-interactive --json)
          echo "$BUILD_OUTPUT"
          
          BUILD_ID=$(echo "$BUILD_OUTPUT" | jq -r '.[0].id // .id')
          echo "BUILD_ID=$BUILD_ID" >> $GITHUB_OUTPUT
          echo "Build ID: $BUILD_ID"

      - name: Wait for build to complete
        run: |
          BUILD_ID="${{ steps.build.outputs.BUILD_ID }}"
          
          echo "⏳ Waiting for build to complete (this may take 15-20 minutes)..."
          
          for i in {1..60}; do
            STATUS=$(npx eas-cli build:view $BUILD_ID --json | jq -r '.status')
            echo "Build status: $STATUS (check $i/60)"
          
            if [ "$STATUS" = "FINISHED" ]; then
              echo "✅ Build completed successfully!"
              break
            elif [ "$STATUS" = "ERRORED" ] || [ "$STATUS" = "CANCELED" ]; then
              echo "❌ Build failed with status: $STATUS"
              exit 1
            fi
          
            sleep 30
          done

      - name: Download APK
        run: |
          BUILD_ID="${{ steps.build.outputs.BUILD_ID }}"
          TAG="${{ steps.get_version.outputs.VERSION }}"
          
          DOWNLOAD_URL=$(npx eas-cli build:view $BUILD_ID --json | jq -r '.artifacts.buildUrl')
          echo "Download URL: $DOWNLOAD_URL"
          
          curl -L -o meal-planner-${TAG}.apk "$DOWNLOAD_URL"
          ls -lh meal-planner-*.apk

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          files: meal-planner-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Release Notes
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          body: |
            
            ---
            
            ## Installation (Android)
            
            1. Download `meal-planner-${{ steps.get_version.outputs.VERSION }}.apk` below
            2. Enable "Install from Unknown Sources" in your Android settings
            3. Open the APK file and install
            
            ✅ APK successfully attached!
          append_body: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}